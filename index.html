<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vlog 一键粗剪工具（MVP）</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Vlog 一键粗剪工具</h1>
      <p>上传素材 → 选择节奏 → 自动生成粗剪时间线 → 一键生成 MP4 成片。</p>
    </header>

    <main class="layout">
      <section class="panel input-panel">
        <h2>① 上传素材</h2>
        <p class="hint">支持上传多个视频素材（手机拍摄、横竖屏都行）。</p>
        <input id="videoInput" type="file" accept="video/*" multiple />

        <h3>② 选择风格</h3>
        <div class="grid">
          <label>Vlog 风格
            <select id="stylePreset">
              <option value="daily">日常记录（自然节奏）</option>
              <option value="travel">旅行感（快切）</option>
              <option value="food">探店美食（中快节奏）</option>
            </select>
          </label>
          <label>目标成片时长（秒）
            <input id="targetDuration" type="number" min="15" max="300" value="60" />
          </label>
          <label>单镜头最长（秒）
            <input id="maxClipDuration" type="number" min="2" max="12" value="5" />
          </label>
          <label>转场时长（秒）
            <input id="transitionDuration" type="number" min="0" max="1.5" step="0.1" value="0.3" />
          </label>
        </div>

        <div class="actions">
          <button id="analyzeBtn" type="button">分析素材并自动粗剪</button>
          <button id="renderBtn" type="button">自动生成视频成品(MP4)</button>
          <button id="downloadPlanBtn" type="button">导出剪辑计划(JSON)</button>
          <button id="copyPromptBtn" type="button">复制给剪辑软件/AI的指令</button>
          <button id="downloadVideoBtn" type="button" disabled>下载成品视频</button>
        </div>

        <div id="progressBox" class="progress-box" data-status="idle">等待开始</div>

        <h3>素材概览</h3>
        <div id="assetList" class="asset-list">暂无素材</div>
      </section>

      <section class="panel result-panel">
        <h2>③ 自动生成结果</h2>
        <div id="timeline" class="result-box">上传素材后，点击“分析素材并自动粗剪”。</div>

        <h3>④ 成片预览</h3>
        <video id="previewVideo" class="preview-video" controls></video>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
